# 视觉伺服最小验证配置。
# pixel_to_robot_matrix: [dx_px, dy_px] -> [dx_mm, dy_mm]
# 初始值只是估计值，正式使用前必须用实机像素运动数据重新标定后覆盖。
pixel_to_robot_matrix:
  # 第一行：像素误差 dx/dy 对机械臂 X 修正量的影响，单位 mm/px。
  - [0.0, 0.2]
  # 第二行：像素误差 dx/dy 对机械臂 Y 修正量的影响，单位 mm/px。
  - [0.2, 0.0]
# 相机中心对准目标后，吸盘中心需要移动的 [X, Y] 偏移，单位 mm。
# 未启用 sucker_offset_samples 时，使用该固定值。
camera_to_sucker_offset_mm: [-94.1, -13.8]

# 位置相关吸盘偏移：实测样本列表，代码自动拟合，点数灵活（最少 3 个）。
# 每个样本：
#   x, y  : 测量时步骤A（相机对准）的位姿 XY，从机械臂读数记录
#   vx,vy : 实测偏移 = 步骤B（吸盘对准）位姿 - 步骤A 位姿，取 XY
#   anchor: true 的样本是基线锚点，模型强制穿过它（建议 = 工作区中心实测）。
# 推荐 5 点布局：中心(anchor) + 左上/右上/左下/右下。四角放在"抓取区+托盘区"
# 并集范围的四个极角，保证 clamp 罩住所有实际抓放点。点数灵活：加行即可，代码无需改动。
# 启用：取消下面注释并填入实测数据；未启用时走上面的固定偏移。
sucker_offset_samples:
  # 中上（anchor）
  - {x: -360.675, y: 19.956, vx: -83.939, vy: -13.070, anchor: true}
  # 中中
  - {x: -249.221, y: 20.162, vx: -84.290, vy: -13.082}
  # 中下
  - {x: -150.170, y: 21.494, vx: -85.766, vy: -12.746}
  # 左上
  - {x: -357.757, y: -213.634, vx: -83.110, vy: -12.565}
  # 左中
  - {x: -255.651, y: -205.432, vx: -83.679, vy: -12.618}
  # 左下
  - {x: -179.825, y: -200.226, vx: -83.807, vy: -12.719}
  # 右上
  - {x: -332.296, y: 235.417, vx: -84.563, vy: -13.046}
  # 右中
  - {x: -265.089, y: 258.656, vx: -85.222, vy: -12.996}
  # 右下
  - {x: -157.650, y: 239.067, vx: -85.271, vy: -12.295}
