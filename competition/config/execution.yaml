# 比赛执行与运动参数。
#
# 坐标约定：
# - 位置单位为 mm，角度单位为 deg。
# - pose 顺序固定为 [x, y, z, rx, ry, rz]。
# - 所有 z 都是机器人基坐标系下的绝对高度，不是相对移动距离。
#
# 调参提醒：
# - 修改抓取或摆放高度前，先单块低速验证，避免吸盘或相机撞到桌面/托盘。
# - 视觉伺服矩阵和相机到吸盘偏移不在本文件中，它们位于 visual_servo.yaml。
# - 标定/正式模式由 launch 文件的 calibration_mode 参数决定：
#   competition.launch=false（正式抓放），calibration.launch=true（标定采集）。

# 高位全场拍摄位姿。
# 总控启动后会先运动到这里；图像节点沿用其中的 R/P/YAW 组成标定观察位。
shooting_pose: [-250.4151306152343, 22.14801216125488, 380.3343505859375, -180, 0, 90]

motion:
  # 普通大范围 MoveL 的速度参数，例如复位、粗定位、抬起和移动到摆放区。
  # 具体物理单位由机械臂 SDK 定义；数值越大运动越快。
  arm_speed: 50

  # 抓取和摆放下探时的 MoveL 速度参数。
  # 下探比普通移动慢，用于降低碰撞和压坏方块的风险。
  pick_speed: 50

  # 视觉伺服每轮 XY 修正时的 MoveL 速度参数。
  # 太大可能过冲或画面未稳定，太小会增加每轮闭环耗时。
  servo_speed: 50

  # 高度策略得到方块上表面的基坐标系绝对 Z 后，
  # 吸盘实际抓取高度相对该表面的偏移，单位 mm。
  pick_surface_offset_mm: 153.0

  # 最终抓取位上方的动态预抓取间隙，单位 mm。
  # 预抓取位会在这里等待机械臂停稳，随后仅下探该距离吸取方块。
  pick_approach_clearance_mm: 3.0

  # 从方块相机伺服位斜向移动到吸盘预抓取位时的 MoveL 速度参数。
  pick_approach_speed: 50

  # 抓取后竖直抬升点的 MoveL 圆滑半径，单位 mm。
  # 大于 0 时机械臂不会在抬升点停下，而会圆滑拐向托盘区域；0 表示关闭圆滑。
  pick_retreat_blend_radius_mm: 5.0

  # 摆放释放前的下探深度，单位 mm。
  # 到达最终摆放位后继续竖直下探该距离再喷气；0 表示关闭下探、直接在释放高度喷气。
  place_descent_offset_mm: 5.0

  # 到达最终摆放位时的 MoveL 圆滑半径，单位 mm。
  # 大于 0 时机械臂不在摆放位停下，而圆滑拐向下探点；0 表示关闭圆滑、精确停在摆放位。
  # 必须小于 place_descent_offset_mm，否则圆滑会吞掉整段下探。
  place_descent_blend_radius_mm: 2.0

  # 喷气后竖直抬升点的 MoveL 圆滑半径，单位 mm。
  # 抬升距离固定等于 place_descent_offset_mm（下戳多少就抬回多少）。
  # 大于 0 时机械臂不在抬升点停下，而圆滑拐向下一块方块的抓取；0 表示关闭圆滑。
  # 必须小于 place_descent_offset_mm，否则圆滑会吞掉整段抬升。
  place_lift_blend_radius_mm: 2.0

  # 所有正式 TCP 运动命令允许的最低绝对 Z。
  # 这是最低安全高度的唯一配置来源；controller、感知节点和网页直连硬件都读取本字段。
  # 总控会在发出命令前主动拒绝低于该值的观察位和最终抓放位，避免依赖控制层静默钳制。
  minimum_tcp_z_mm: 163.0

servo:
  # true：执行方块和托盘低位视觉伺服；false：使用高位粗定位结果开环抓放。
  # 本开关在比赛节点启动时读取，修改后需要重启节点。
  # 标定采集依赖视觉伺服结果，因此 calibration_mode=true 时会强制按 true 执行。
  enabled: false

  # 是否输出任务步骤及视觉伺服分阶段耗时。定位完成后可关闭，减少正式运行时的日志 I/O。
  timing_debug: false

  # 方块视觉伺服成功阈值，单位 px。
  # 方块模板匹配结果落在整像素网格上；每轮取 max(abs(dx), abs(dy))，不超过该值才算一帧对准。
  block_error_threshold_px: 1.0

  # 托盘视觉伺服成功阈值，单位 px。
  # 托盘圆点使用亚像素质心，半格目标还会对多个圆点取均值，因此可以使用更严格的小数阈值。
  tray_error_threshold_px: 0.5

  # 单轮机械臂 XY 修正的最小长度，单位 mm。
  # 只有像素误差仍超出成功阈值时才生效，用于避免修正量小到机械臂不响应。
  min_step_mm: 0.05

  # 单轮机械臂 XY 修正的最大长度，单位 mm。
  # 用来限制误识别或瞬时大偏差造成的危险跳动。
  max_step_mm: 5.0

  # 每次方块或托盘视觉对准允许执行的最大识别轮数。
  # 达到该轮数仍未连续稳定时，本次视觉伺服失败并停止后续下探。
  max_iter: 40

  # 需要连续多少帧都进入对应目标的误差阈值，才判定真正对准成功。
  # 增大可降低偶然抖动造成的误判，但会增加对准时间。
  success_stable_frames: 4

  # 标定模式对准成功后保持机械臂不动，额外读取低位检测帧用于估计终止噪声。
  # 正式模式始终忽略该值，不增加抓放时间。
  post_success_sample_frames: 0

  # 最多允许连续多少帧没有识别到目标。
  # 达到该数值后停止视觉伺服，不再盲目移动机械臂。
  max_missed_frames: 5

  # 每轮移动或识别后的画面稳定等待时间，单位 s。
  # 当前为 0，若机械臂停止后画面仍明显抖动，可逐步增加。
  settle_sec: 0.5

tool_motor:
  # 每次 prepare 拍摄前都会主动发送该绝对角度，并按无反馈最坏角差等待完成。
  # 复位发生在用户确认开始执行之前，不计入摆放方案成本。
  initial_angle_deg: 180.0

  # 舵机估计转速，单位 deg/s。
  # 用于估算抓取前预旋转和抓取后摆放旋转的完成时间，不会改变舵机本身的实际速度。
  velocity_deg_per_sec: 270.0

  # 舵机可用范围的下侧安全角度。
  # 当“当前角度 + 本次旋转量”将低于 0° 时，程序会先重新选择抓取角度，给摆放旋转留余量。
  lower_margin_deg: 10.0

  # 舵机可用范围的上侧安全角度。
  # 当“当前角度 + 本次旋转量”将高于 360° 时，程序会先重新选择抓取角度，避免顶到机械限位。
  upper_margin_deg: 350.0
