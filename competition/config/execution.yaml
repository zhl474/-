# 比赛执行与运动参数。
#
# 坐标约定：
# - 位置单位为 mm，角度单位为 deg。
# - pose 顺序固定为 [x, y, z, rx, ry, rz]。
# - 所有 z 都是机器人基坐标系下的绝对高度，不是相对移动距离。
#
# 调参提醒：
# - 修改抓取或摆放高度前，先单块低速验证，避免吸盘或相机撞到桌面/托盘。
# - 视觉伺服矩阵和相机到吸盘偏移不在本文件中，它们位于 visual_servo.yaml。

# 高位全场拍摄位姿。
# 总控启动后会先运动到这里；图像节点也使用这套姿态计算深度粗定位观察位。
shooting_pose: [-250.4151306152343, 22.14801216125488, 380.3343505859375, -180, 0, 90]

motion:
  # 普通大范围 MoveL 的速度参数，例如复位、粗定位、抬起和移动到摆放区。
  # 具体物理单位由机械臂 SDK 定义；数值越大运动越快。
  arm_speed: 100

  # 抓取和摆放下探时的 MoveL 速度参数。
  # 下探比普通移动慢，用于降低碰撞和压坏方块的风险。
  pick_speed: 60

  # 视觉伺服每轮 XY 修正时的 MoveL 速度参数。
  # 太大可能过冲或画面未稳定，太小会增加每轮闭环耗时。
  servo_speed: 100

  # 深度相机测得方块上表面在机器人基坐标系下的 Z 后，
  # 吸盘实际抓取高度相对该表面的偏移，单位 mm。
  # 深度测到方块顶面时填吸盘接触余量；若测到承载面，则填方块高度及接触余量。
  pick_surface_offset_mm: 162.0

  # 方块吸取前的吸盘高位，也是吸取成功后的抬起高度。
  lift_z: 205.0

  # 托盘视觉伺服完成后，吸盘携带方块先运动到的摆放高位。
  place_high_z: 197.0

  # 最终释放方块时下放到的绝对 Z 高度。
  # 不能低于控制节点安全下限。
  place_down_z: 197.0

  # 喷气释放后，相对 place_down_z 向上抬起的距离。
  # 例如当前值 20 表示释放后抬到 208 mm。
  place_lift_step_mm: 0.0

servo:
  # 是否输出视觉伺服分阶段耗时。调试时开启，正式运行时关闭以避免日志 I/O 影响闭环频率。
  timing_debug: false

  # 视觉伺服成功阈值，单位 px。
  # 每轮取 max(abs(dx), abs(dy))；不超过该值才算一帧对准。
  # 调小会更精确但更难稳定，调大会更容易结束但残余偏差更大。
  error_threshold_px: 2.0

  # 单轮机械臂 XY 修正的最小长度，单位 mm。
  # 只有像素误差仍超出成功阈值时才生效，用于避免修正量小到机械臂不响应。
  min_step_mm: 0.05

  # 单轮机械臂 XY 修正的最大长度，单位 mm。
  # 用来限制误识别或瞬时大偏差造成的危险跳动。
  max_step_mm: 5.0

  # 每次方块或托盘视觉对准允许执行的最大识别轮数。
  # 达到该轮数仍未连续稳定时，本次视觉伺服失败并停止后续下探。
  max_iter: 40

  # 需要连续多少帧都进入 error_threshold_px，才判定真正对准成功。
  # 增大可降低偶然抖动造成的误判，但会增加对准时间。
  success_stable_frames: 2

  # 最多允许连续多少帧没有识别到目标。
  # 达到该数值后停止视觉伺服，不再盲目移动机械臂。
  max_missed_frames: 5

  # 每轮移动或识别后的画面稳定等待时间，单位 s。
  # 当前为 0，若机械臂停止后画面仍明显抖动，可逐步增加。
  settle_sec: 0.0

tool_motor:
  # 程序启动时假定舵机已经位于的角度。
  # 该值只初始化软件状态，不会在启动时主动发送旋转命令；实机初始角度必须一致。
  initial_angle_deg: 180.0

  # 舵机估计转速，单位 deg/s。
  # 只用于估算避限位预旋转需要等待多久，不会改变舵机本身的实际速度。
  velocity_deg_per_sec: 270.0

  # 舵机可用范围的下侧安全角度。
  # 当“当前角度 + 本次旋转量”将低于 0° 时，程序会先重新选择抓取角度，给摆放旋转留余量。
  lower_margin_deg: 10.0

  # 舵机可用范围的上侧安全角度。
  # 当“当前角度 + 本次旋转量”将高于 360° 时，程序会先重新选择抓取角度，避免顶到机械限位。
  upper_margin_deg: 350.0
