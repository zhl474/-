# 视觉伺服配置。
# pixel_to_robot_matrix: [dx_px, dy_px] -> [dx_mm, dy_mm]
# 初始值只是估计值，正式使用前必须用实机像素运动数据重新标定后覆盖。
pixel_to_robot_matrix:
  # 第一行：像素误差 dx/dy 对机械臂 X 修正量的影响，单位 mm/px。
- [0.0, 0.2]
  # 第二行：像素误差 dx/dy 对机械臂 Y 修正量的影响，单位 mm/px。
- [0.2, 0.0]
# 相机中心对准目标后，吸盘中心需要移动的 [X, Y] 偏移，单位 mm。
# 该值 = 工作区中心点实测基线（步骤B 吸盘对准位姿 - 步骤A 相机对准位姿）。
camera_to_sucker_offset_mm: [-84.081, -13.234]

# 吸盘偏移标定策略：
#   SINGLE_CALIBRATION  单参数策略（默认，等价旧行为）：方块、托盘全部使用上方中间偏移，
#                       高位拟合模型使用单模型（block_pixel_to_tcp_calibration.yaml）。
#   THREE_CALIBRATION   三参数策略：托盘恒用中间偏移与托盘模型；方块按高位检测像素 u
#                       相对图像中线（1280 宽图，u=640）分左右——偏移分别用下方
#                       left/right 两套偏移，高位拟合模型分别用 perception.yaml 的
#                       calibration.block_pixel_to_tcp_left/right 两套标定文件。
# 切换策略后需要重启 competition 与 image_process 两个节点生效。
sucker_offset_strategy: THREE_CALIBRATION
# 左侧方块偏移（THREE_CALIBRATION 策略下 u < 640 使用），单位 mm。
# 初始与中间一致（等价旧行为），实测左侧方块后替换。
camera_to_sucker_offset_left_mm: [-82.915, -13.079]
# 右侧方块偏移（THREE_CALIBRATION 策略下 u >= 640 使用），单位 mm。
# 初始与中间一致（等价旧行为），实测右侧方块后替换。
camera_to_sucker_offset_right_mm: [-84.346, -12.789]

# 位置相关吸盘偏移残差模型（v3 方案：7 点十字采样，采集后填系数）。
# 残差 Δv = 当前位置实测吸盘偏移 - 中心基线（camera_to_sucker_offset_mm）。
# 判定规则（数据回来后二选一）：
#   上/下点与中心点的 Δvx、Δvy 差异均 < 0.4mm → 1D，用 X 线 5 点拟合；
#   否则 → 2D，用全部 7 点最小二乘。
# type 取值：
#   none                  仅使用固定偏移（未标定/兜底，等价旧行为）
#   linear_1d_x_residual  Δvx = k_x·(X − x0)，Δvy = 0
#   linear_2d             Δvx = kx·(X − x0) + ky·(Y − y0)
#                         Δvy = lx·(X − x0) + ly·(Y − y0)
# X/Y 为步骤A（相机对准）时的位姿 XY；计算前先 clamp 到采样范围，禁止外推。
sucker_offset_model:
  type: none
  # 1D 参数（type: linear_1d_x_residual 时填写并取消注释）：
  # k_x: 0.0053
  # x0: -300.0
  # clamp_min_x: -450.0
  # clamp_max_x: -150.0
  # 2D 参数（type: linear_2d 时填写并取消注释）：
  # kx: 0.0053
  # ky: 0.0012
  # lx: 0.0
  # ly: 0.0
  # x0: -300.0
  # y0: 0.0
  # clamp_min_x: -450.0
  # clamp_max_x: -150.0
  # clamp_min_y: -120.0
  # clamp_max_y: 120.0
