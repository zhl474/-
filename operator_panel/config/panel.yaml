# 本地控制台自身配置。硬件和识别参数仍分别保存在原项目 YAML 中。
server:
  host: 0.0.0.0 # 改回 127.0.0.1 则只允许本机访问；0.0.0.0 允许局域网/热点设备访问
  port: 8765

preview:
  fps: 2.0
  jpeg_quality: 78

manual_control:
  timed_blow_seconds: 1.0
  reset_speed: 50
  relative_move_speed: 50
  arm_ip: 192.168.58.2
  arm_port: 20003
  servo_port: /dev/servo_motor
  servo_baudrate: 115200
  minimum_z_mm: 165.0

timeouts:
  ros_master_seconds: 10.0
  hardware_start_seconds: 30.0
  perception_start_seconds: 120.0
  process_stop_seconds: 8.0
  aruco_align_seconds: 300.0

output:
  debug_output_dir: /home/zhl/桌面
  servo_csv_output_dir: /home/zhl/桌面/标定数据
