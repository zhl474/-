models:
  # 高位识别各个俄罗斯方块类别和姿态的检测模型。
  detection: competition/model/best5.14.pt
  # 高位托盘外框识别模型，供后续 140 个格点检测裁剪托盘区域。
  board: competition/model/best.pt
  # 方块上表面分割模型。正式运行使用 TensorRT engine 加速。
  segmentation: competition/model/best_seg.engine

# 固定盘面最短摆放方案 V1。shadow 计算并记录新方案，但仍执行旧匈牙利方案。
task_sequence_optimizer:
  mode: legacy            # legacy / shadow / execute
  beam_width: 5000
  report_top_candidates: 20

# 普通 260 分任务的 V5 动态盘面选择。shadow 完整计算并记录，但仍执行固定 YAML。
dynamic_board_selection:
  mode: disabled                # disabled / shadow / execute
  library_path: image_process/config/v5_board_library_v1.npz
  coarse_top_k: 1000
  final_candidate_k: 100
  keep_coarse_boundary_ties: true
  comparison_beam_width: 1000
  comparison_returned_candidates: 1
  comparison_worker_count: 12
  confirmation_candidate_k: 10
  confirmation_beam_width: 5000
  confirmation_returned_candidates: 20
  confirmation_worker_count: 10
  soft_time_budget_sec: 10.0
  failure_prompt_timeout_sec: 60.0

# 高位方块 Seg/模板匹配完成后，在像素转 TCP、深度采样和任务规划前人工修正 Mask。
# GUI 始终运行在独立无 ROS 子进程中；false 时完全沿用原自动识别流程。
high_mask_manual_editor:
  enabled: true
  script: tools/high_mask_editor_demo/high_mask_session_editor.py
  # 人工编辑期间不运行其他 GPU 推理时使用 cuda；需要隔离显存时可改为 cpu。
  preview_device: cuda

# 高位 YOLO 检测出框后、上表面分割和模板匹配前人工修正检测框：
# 选类别画框（漏检）、删除错误框（多检）、改选中框类别（识别错）。
# 修正后的框与 YOLO 原生框走完全相同的下游；GUI 运行在独立无 ROS 子进程中。
yolo_manual_correction:
  enabled: true
  script: tools/yolo_box_editor/yolo_box_editor.py

calibration:
  # 正式运行部署副本；也可由对应 ROS 私有参数覆盖。
  block_pixel_to_tcp: image_process/config/block_pixel_to_tcp_calibration.yaml
  tray_pixel_to_tcp: image_process/config/tray_pixel_to_tcp_calibration.yaml
  hand_eye_matrix: camera/config/T_wrist2camera.npy
  # 左右方块标定文件（THREE_CALIBRATION 策略下按方块像素 u<640/u>=640 分侧使用）：
  # 8-18 部署 29 点批次 20260817T225341 分侧文件（左15 affine / 右14 homography），
  # 与 block/tray 同批，批次一致性校验可过。
  block_pixel_to_tcp_left: image_process/config/block_pixel_to_tcp_calibration_left.yaml
  block_pixel_to_tcp_right: image_process/config/block_pixel_to_tcp_calibration_right.yaml
  # direct（九点标定）分流分支的标定文件：由 tools/vision/nine_point_calibration.py
  # 填入像素-TCP 点对后生成（方块左右分侧 + 中心回退 + 托盘单模型共四份）。
  # 文件齐全时 direct/shadow 分支可用；mode 设为 direct/shadow 前必须先完成生成。
  block_pixel_to_tcp_direct: image_process/config/block_pixel_to_tcp_calibration_direct.yaml
  block_pixel_to_tcp_direct_left: image_process/config/block_pixel_to_tcp_calibration_direct_left.yaml
  block_pixel_to_tcp_direct_right: image_process/config/block_pixel_to_tcp_calibration_direct_right.yaml
  tray_pixel_to_tcp_direct: image_process/config/tray_pixel_to_tcp_calibration_direct.yaml

# 高位模板匹配：先按 Mask 白色前景宽高筛选候选角度，再用紧边框模板做无 padding 卷积。
# 尺寸筛选不可靠时回退到全角度、same-padding 慢匹配；本轮不修改低位匹配。
high_template_match:
  # 高位快速匹配总开关；false 时始终使用全角度、same-padding 慢匹配。
  enabled: true
  # 第一轮尺寸筛选容差：模板前景宽高与 Mask 前景宽高分别相差不超过 4 像素时保留。
  size_tolerance_px: 20
  # 第一轮候选太少时使用的放宽容差：宽高分别相差不超过 8 像素时保留。
  relaxed_size_tolerance_px: 40
  # 候选角度至少需要 3 个；少于 3 个说明尺寸先验不可靠。
  min_candidate_angles: 3
  # 每个紧边框模板在白色前景四周保留 2 像素黑边，防止旋转栅格化边缘贴住核边界。
  kernel_safety_margin_px: 2
  # 手动补边后每个方向至少允许模板平移 4 像素，补边后输入至少为卷积核加 8 像素。
  minimum_translation_margin_px: 20
  # 尺寸筛选失败时是否使用当前全角度、same-padding 慢匹配。
  legacy_fallback_enabled: true

# 高位方块识别链选择。V1 = YOLO 出框 + YOLO-Seg 分割 + 模板匹配（原链路，零改动）；
# V2 = YOLO 出框 + Canny 距离场全角度边缘模板匹配（tools/vision/edge_template_test 已验证）。
# px/py/theta 输出口径与 V1 一致（L 类同为方案A抓点），可复用已部署的像素转 TCP 标定。
# mode 可被运行时私有参数覆盖：rosparam set /image_process_node/block_recognition_mode v1
# 切换即时生效，无需重启节点；标定模式同样跟随此开关（v2 时无 Mask 人工修正，
# 换成 YOLO 框修正 + 角度锁定编辑；fallback_to_v1 回退兜底同样生效）。
block_recognition:
  # v1     只跑旧识别（默认，行为与旧版完全一致）
  # v2     跑 V2 边缘模板识别
  # shadow 正式执行 V1 结果不变，同一张图同时跑 V2，日志逐块输出新旧偏差
  mode: v2
  # v2 识别异常或零方块时，同一请求内自动回退完整 V1 链（比赛保命开关）。
  fallback_to_v1: true
  v2:
    # 全角度采样步进，单位度；越小越准越慢（验证时用 2.0）。
    angle_step_deg: 2.0
    canny_low: 50
    canny_high: 150
    gaussian_ksize: 3
    # 距离场截断：距边缘超过该值的像素价值为 0。
    distance_cap_px: 20.0
    # YOLO 框四边外扩后裁剪 ROI。
    crop_margin_px: 8
    # 核画布四周黑边。
    kernel_margin_px: 2
    # ROI 补边平移搜索余量。
    search_margin_px: 20
    # V2 角度锁定人工编辑：匹配结果出来后弹窗点选方块锁角度（A/D 微调、
    # Z/C 粗调、T 精确输入），提交后按锁定角度重匹配位置，L 抓点自动跟随。
    # Esc 放弃修改按原结果继续。GUI 独立无 ROS 子进程；仅 v2 模式生效。
    angle_lock_editor:
      enabled: true
      script: tools/angle_lock_editor/angle_lock_editor.py

# 仅在 execution.yaml 的 calibration_mode=true 时使用。
# 每个目标像素在每帧先取 3×3 邻域有效深度的中位数，再对多帧结果计算中位数和 MAD。
# 任一方块深度门禁或方块平面门禁失败时，本轮标定准备直接失败，不读取旧标定兜底。
calibration_depth:
  # 收到批量查询请求后需要重新采集的深度帧数。请求前缓存不参与计算；
  # 所有方块和托盘点共用请求后采集的这 15 帧。
  frame_count: 15

  # 单个目标点至少需要多少帧能在其 3×3 邻域取得有效深度。
  # 例如设为 10，15 帧中只有 9 帧有效时，该目标无效并终止本轮标定准备。
  min_valid_frames: 10

  # 等待请求后新深度帧的最长时间，单位秒。收满 frame_count 帧后立即计算；
  # 超时仍未收满时明确报出实际帧数，不使用请求前旧帧，也不永久等待。
  capture_timeout_sec: 2.0

  # 方块跨帧深度 MAD 上限，单位 mm。MAD 是各帧深度与多帧中位数之差的绝对值中位数，
  # 用于衡量深度抖动，对少量离群值比标准差更稳健；方块 MAD 大于 1.0 mm 时拒绝标定。
  # 托盘 MAD 只写入 CSV 供检查，不使用这个阈值，因为托盘深度 Z 不参与高度计算。
  block_max_mad_mm: 1.0

  # 用全部方块深度点生成观察 TCP 坐标后，拟合 z=a*x+b*y+c 平面的 RMSE 上限，单位 mm。
  # 至少需要 3 个 XY 不共线的方块点；拟合 RMSE 大于 1.0 mm 时认为方块高度不一致或深度异常，
  # 禁止继续生成托盘粗定位位姿和执行后续低位运动。
  block_plane_max_rmse_mm: 1.0

  # 托盘 TCP 平面相对于方块低位观察 TCP 平面的有符号高度差，不是物理表面高度差。
  # 对任意相同机器人 XY：Z_tray(X,Y)=Z_block_observation(X,Y)-该值；正数表示托盘更低，负数表示托盘更高。
  # 托盘深度只提供粗定位 X/Y，其深度 Z 无论如何波动都不会改变这里计算出的托盘 TCP Z。
  tray_tcp_below_block_observation_mm: -9.0

high_tcp_localization:
  # 高位像素→TCP 定位链路分流：
  #   servo  现行伺服数据拟合标定（默认，行为与历史完全一致）
  #   direct 九点标定版（上方 calibration.*_direct 四份文件，方块按 u<640/u>=640
  #          分左右模型，托盘单模型；文件由 tools/vision/nine_point_calibration.py 生成）
  #   shadow 正式执行 servo 结果不变，同一像素并算 direct，日志输出两分支偏差
  # mode 可被运行时私有参数覆盖：rosparam set /image_process_node/high_tcp_localization_mode direct
  # 切换即时生效，无需重启节点（direct 分支需启动时四份标定文件已齐全）；
  # 面板改此默认值需重启 perception 节点生效；标定模式不走此开关。
  mode: servo

  # 2026-08-17 场地变动后 XY 安全限位已停用：代码不再按这两个范围拦截任何位姿，
  # 仅保留 Z 下限（execution.yaml motion.minimum_tcp_z_mm）。键本身仅供
  # 网页 z_plane 对照展示和配置校验使用，改数值不会恢复拦截。
  safe_x_range_mm: [-520.224, -148.17]
  safe_y_range_mm: [-305.0, 315.925]

  # 2026-08-16 工作台为水平平面，深度相机 Z 不可信：true 时正式模式 TCP Z
  # 固定为下方常数，不再使用标定 yaml 的 z_plane（斜相机拟合出的 a/b 视为噪声清零）。
  # XY 仍用 xy_model 预测加视觉伺服修正；深度相机只保留在标定模式链路。
  # 常数取自 20260815T212913 批次 block z_plane 的 c；tray = block + 9（托盘高于方块观察面）。
  # 节点每次启动都会打印固定值与标定平面的对照；回滚只需 enabled: false 并重启节点。
  fixed_tcp_z:
    enabled: true
    block_observation_z_mm: 173.46
    tray_z_mm: 182.46

pick_height:
  # 正式模式由观察 TCP Z 减该值得到表面 Z；标定模式由表面深度加该值得到观察 TCP Z。
  block_observation_height_mm: 167.0

fallback:
  # 该回退仅属于方块上表面分割，不参与高位 TCP 粗定位。
  color_segmentation: true

block_servo:
  # 正常帧允许抓取点相对画面中心移动的像素范围，卷积输出固定为 2*search_radius_px+1 的方形。
  search_radius_px: 30
  # 首次结果触边时扩大后的搜索范围。
  fallback_search_radius_px: 50
  # 结果或前景进入边缘多少像素时触发扩大搜索。
  boundary_guard_px: 3
  # 紧边框模板四周保留的黑色安全边。
  kernel_safety_margin_px: 2
  # 扩大搜索仍异常时是否启用旧慢速匹配。
  legacy_fallback_enabled: true
  angle_window_deg: 5.0
  angle_step_deg: 1.0
  white_s_max: 45
  white_v_min: 180
  min_foreground_area: 200

board_servo:
  roi_half_size: 90
  blackhat_kernel_size: 27
  min_dot_area: 200
  max_dot_area: 800
  min_dot_circularity: 0.35
  max_dot_aspect_ratio: 1.8

visual_servo_debug:
  # false 时不构建、不编码也不输出低位方块和托盘视觉伺服调试图像。
  # true 时仅录制两路低位视觉伺服调试视频，不保存单帧 JPG。
  enabled: true
  # 调试视频输出目录；目录不可写时仅记录警告，不影响视觉伺服。
  output_dir: /home/zhl/桌面
  # 方块和托盘调试视频使用相同帧率。
  video_fps: 10.0
