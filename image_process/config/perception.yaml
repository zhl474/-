models:
  # 高位识别各个俄罗斯方块类别和姿态的检测模型。
  detection: competition/model/best5.14.pt
  # 高位托盘外框识别模型，供后续 140 个格点检测裁剪托盘区域。
  board: competition/model/best.pt
  # 方块上表面分割模型。正式运行使用 TensorRT engine 加速。
  segmentation: competition/model/best_seg.engine

calibration:
  # 正式运行部署副本；也可由对应 ROS 私有参数覆盖。
  block_pixel_to_tcp: image_process/config/block_pixel_to_tcp_calibration.yaml
  tray_pixel_to_tcp: image_process/config/tray_pixel_to_tcp_calibration.yaml

high_tcp_localization:
  # 高位标定预测出的观察 TCP 必须落在实测安全 XY 范围内。
  safe_x_range_mm: [-444.224, -148.17]
  safe_y_range_mm: [-263.279, 315.925]

pick_height:
  # calibrated_height：由观察 TCP Z 减固定观察高度推导方块表面 Z。
  # depth_height：调用 /camera/surface_height 获取方块表面绝对 Z。
  mode: calibrated_height
  block_observation_height_mm: 192.0

fallback:
  # 该回退仅属于方块上表面分割，不参与高位 TCP 粗定位。
  color_segmentation: true

block_servo:
  angle_window_deg: 5.0
  angle_step_deg: 1.0
  roi_expand_px: 50
  # true 时低位方块先按高位角度转正为紧凑 ROI，再使用紧凑矩形模板核匹配。
  rectified_roi_enabled: true
  white_s_max: 45
  white_v_min: 180
  min_foreground_area: 200

board_servo:
  roi_half_size: 90
  blackhat_kernel_size: 27
  min_dot_area: 200
  max_dot_area: 800
  min_dot_circularity: 0.35
  max_dot_aspect_ratio: 1.8

visual_servo_debug:
  # false 时不构建、不编码也不输出低位方块和托盘视觉伺服调试图像。
  # true 时仅录制两路低位视觉伺服调试视频，不保存单帧 JPG。
  enabled: false
  # 调试视频输出目录；目录不可写时仅记录警告，不影响视觉伺服。
  output_dir: /home/zhl/桌面
  # 方块和托盘调试视频使用相同帧率。
  video_fps: 10.0
